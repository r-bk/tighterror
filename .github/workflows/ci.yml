name: CI

on:
  push:
    branches:
      - 'main'
      - '**_ci'
  pull_request:
  schedule:
    - cron: '0 1 * * 5'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings

jobs:
  ci:
    name: ci (${{ matrix.rust }}, ${{ matrix.runs_on }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - msrv
        runs_on:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: msrv
        id: msrv
        run: sed -n 's/^rust-version = "\(.*\)"$/version=\1/p' Cargo.toml >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust == 'msrv' && steps.msrv.outputs.version || matrix.rust }}
          components: rustfmt, clippy
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets
      - name: extra-tests build
        run: cargo build --workspace --all-features --all-targets
        working-directory: crates/tighterror-build/tests/extra
      - name: extra-tests test
        run: cargo test --workspace --all-features --all-targets
        working-directory: crates/tighterror-build/tests/extra
      - name: extra-tests clippy
        run: cargo clippy --workspace --all-features --all-targets
        working-directory: crates/tighterror-build/tests/extra

  no-rustfmt:
    runs-on: ubuntu-latest
    env:
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: remove rustfmt
        run: |
          if which rustfmt; then
            rm $(which rustfmt)
            echo "remove-rustfmt: REMOVED"
          fi
          if which rustfmt; then
            echo "remove-rustfmt: VERIFY ERR"
            exit 1
          else
            echo "remove-rustfmt: VERIFY OK"
          fi
        shell: bash
      - name: build without rustfmt
        run: cargo build -vv --workspace --all-features --all-targets
      - name: test without rustfmt
        run: cargo test --workspace --all-features --all-targets
      - name: check without rustfmt
        run: cargo check --workspace --all-features --all-targets
      - name: extra-tests build without rustfmt
        run: cargo build -vv --workspace --all-features --all-targets
        working-directory: crates/tighterror-build/tests/extra
      - name: extra-tests test without rustfmt
        run: cargo test --workspace --all-features --all-targets
        working-directory: crates/tighterror-build/tests/extra
      - name: extra-tests check without rustfmt
        run: cargo check --workspace --all-features --all-targets

  common-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - name: format all
        run: cargo fmt -- --check
      - name: extra-tests fmt
        run: cargo fmt --check
        working-directory: crates/tighterror-build/tests/extra
      - name: doc
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
        run: cargo doc --workspace --all-features --no-deps
      - name: extra-tests doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
        working-directory: crates/tighterror-build/tests/extra

  compilation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: test
        run: cargo test
        working-directory: crates/tighterror-build/tests/compilation
      - name: clippy
        run: cargo clippy --all-features --all-targets
        working-directory: crates/tighterror-build/tests/compilation
      - name: fmt
        run: cargo fmt --check
        working-directory: crates/tighterror-build/tests/compilation
      - name: fmt-inner
        run: cargo fmt -- --check tests/compile-fail/*.rs
        working-directory: crates/tighterror-build/tests/compilation
