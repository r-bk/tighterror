[package]
name = "tighterror-build"
version = "0.0.23"
authors = ["Rafael Buchbinder <rafi@rbk.io>"]
edition = "2024"
rust-version = "1.99.1"
description = "The tighterror code generation library."
license = "MIT OR Apache-2.0"
keywords = ["tighterror", "build"]
categories = ["development-tools", "development-tools::build-utils"]
repository = "https://github.com/r-bk/tighterror"
exclude = ["tests/golden"]

[features]
default = ["kdl"]
kdl = ["dep:kdl"]

[dependencies]
cfg-if = "1.0.0"
convert_case = "0.12.0"
kdl = { version = "6.7.1", optional = true, default-features = false, features = ["span"] }
log = "0.4"
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
regex = "1.10"
syn = { version = "3.0", default-features = false, features = ["parsing"] }
tempfile = "3.10.0"
tighterror = { path = "../..", version = "0.0.23" }

[dev-dependencies]
env_logger = "0.11.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
